<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="ChicStyle boutique storefront layout">
  <defs>
    <filter id="csBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70" />
    </filter>
    <filter id="csShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#4b4438" flood-opacity="0.14" />
    </filter>
    <style>
      text { font-family: 'Inter', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#e9eadd" />
  <circle cx="1250" cy="220" r="320" fill="#dfe2d0" opacity="0.9" filter="url(#csBlur)" />
  <circle cx="300" cy="860" r="300" fill="#e4e6d6" opacity="0.9" filter="url(#csBlur)" />

  <text x="132" y="150" font-size="34" font-weight="600" letter-spacing="14" fill="#33302a">CHICSTYLE</text>
  <text x="136" y="186" font-size="13" letter-spacing="3" fill="#8b8578">BOUTIQUE · COLLECTION 01</text>
  <rect x="136" y="214" width="88" height="2" fill="#b08a5a" />

  <!-- product card one -->
  <g transform="translate(400 260)" filter="url(#csShadow)">
    <rect width="330" height="520" rx="26" fill="#f7f3e9" stroke="#e2ddcd" stroke-width="1.5" />
    <rect x="24" y="24" width="282" height="380" rx="18" fill="#ece7da" />
    <path d="M120 92 L210 92 L192 150 L216 340 Q165 372 114 340 L138 150 Z" fill="#cdbfa9" />
    <path d="M120 92 Q165 74 210 92" fill="none" stroke="#cdbfa9" stroke-width="7" stroke-linecap="round" />
    <circle cx="165" cy="196" r="4" fill="#f7f3e9" opacity="0.6" />
    <circle cx="165" cy="232" r="4" fill="#f7f3e9" opacity="0.6" />
    <text x="24" y="444" font-size="16" font-weight="600" fill="#2f2c26">Linen wrap dress</text>
    <text x="24" y="468" font-size="13" fill="#8b8578">Rs 2,499</text>
    <rect x="24" y="486" width="76" height="22" rx="11" fill="#b08a5a" opacity="0.16" />
    <text x="38" y="501" font-size="10" letter-spacing="1" fill="#8a6a3f">NEW IN</text>
  </g>

  <!-- product card two -->
  <g transform="translate(770 320)" filter="url(#csShadow)">
    <rect width="330" height="520" rx="26" fill="#f7f3e9" stroke="#e2ddcd" stroke-width="1.5" />
    <rect x="24" y="24" width="282" height="380" rx="18" fill="#e7e6d9" />
    <path d="M126 118 L204 118 L226 330 L104 330 Z" fill="#c3b9a4" />
    <path d="M126 118 Q165 84 204 118" fill="none" stroke="#c3b9a4" stroke-width="7" stroke-linecap="round" />
    <path d="M104 330 Q165 356 226 330" fill="none" stroke="#c3b9a4" stroke-width="7" stroke-linecap="round" />
    <circle cx="165" cy="206" r="26" fill="#f7f3e9" opacity="0.45" />
    <text x="24" y="444" font-size="16" font-weight="600" fill="#2f2c26">Silk midi skirt</text>
    <text x="24" y="468" font-size="13" fill="#8b8578">Rs 1,899</text>
    <rect x="24" y="486" width="98" height="22" rx="11" fill="#b08a5a" opacity="0.16" />
    <text x="38" y="501" font-size="10" letter-spacing="1" fill="#8a6a3f">BESTSELLER</text>
  </g>

  <!-- category chips -->
  <g transform="translate(136 640)">
    <g fill="none" stroke="#c9c6b6" stroke-width="1.5">
      <rect x="0" y="0" width="120" height="38" rx="19" />
      <rect x="134" y="0" width="104" height="38" rx="19" />
      <rect x="252" y="0" width="112" height="38" rx="19" />
    </g>
    <g font-size="12" fill="#4a463c">
      <text x="28" y="24">Dresses</text>
      <text x="160" y="24">Ethnic</text>
      <text x="278" y="24">Accessories</text>
    </g>
  </g>

  <!-- lookbook panel -->
  <g transform="translate(1130 600)" filter="url(#csShadow)">
    <rect width="300" height="260" rx="24" fill="#33302a" />
    <text x="28" y="44" font-size="11" letter-spacing="4" fill="#c8bca6">LOOKBOOK</text>
    <text x="28" y="86" font-size="22" font-weight="600" fill="#f4f1e6">Everyday,</text>
    <text x="28" y="116" font-size="22" font-weight="600" fill="#f4f1e6">elevated.</text>
    <rect x="28" y="140" width="120" height="2" fill="#b08a5a" />
    <text x="28" y="176" font-size="11" fill="#a89e8c">12 new pieces</text>
    <text x="28" y="196" font-size="11" fill="#a89e8c">Cotton · linen · silk</text>
    <circle cx="242" cy="200" r="26" fill="#b08a5a" />
    <path d="M234 200 L250 200 M244 192 L252 200 L244 208" fill="none" stroke="#f4f1e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
