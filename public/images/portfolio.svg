<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Portfolio website preview">
  <defs>
    <linearGradient id="pfAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f3bff" />
      <stop offset="1" stop-color="#6a74ff" />
    </linearGradient>
    <filter id="pfShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#3a362e" flood-opacity="0.16" />
    </filter>
    <style>
      text { font-family: 'Bricolage Grotesque', 'Inter', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#eae4d9" />
  <circle cx="1330" cy="240" r="260" fill="#dfd6c6" opacity="0.85" />
  <circle cx="240" cy="820" r="220" fill="#e2dbcd" opacity="0.85" />

  <g transform="translate(210 130)" filter="url(#pfShadow)">
    <rect width="1180" height="740" rx="22" fill="#f8f5ef" stroke="#ddd5c7" stroke-width="1.5" />
    <rect width="1180" height="56" rx="22" fill="#f1ece2" />
    <rect y="34" width="1180" height="22" fill="#f1ece2" />
    <g fill="#cdc4b4">
      <circle cx="32" cy="28" r="6" />
      <circle cx="54" cy="28" r="6" />
      <circle cx="76" cy="28" r="6" />
    </g>
    <rect x="120" y="18" width="300" height="20" rx="10" fill="#e7e1d5" />

    <!-- site nav -->
    <text x="56" y="118" font-size="16" font-weight="600" fill="#141311">Satya Swamy</text>
    <g fill="#6a665e" font-size="13" font-family="'Inter', Arial, sans-serif">
      <text x="930" y="118">Work</text>
      <text x="996" y="118">About</text>
      <text x="1060" y="118">Contact</text>
    </g>
    <rect x="56" y="140" width="1068" height="1.5" fill="#e2dbcd" />

    <!-- hero type -->
    <text x="52" y="262" font-size="34" fill="#8b857a" font-family="'Inter', Arial, sans-serif">Dangeti Satyanarayana Swamy</text>
    <text x="46" y="430" font-size="150" font-weight="600" fill="#141311">Satya</text>
    <text x="46" y="566" font-size="150" font-weight="600" fill="#141311">Swamy</text>
    <circle cx="700" cy="330" r="9" fill="url(#pfAccent)" />
    <circle cx="968" cy="520" r="120" fill="url(#pfAccent)" opacity="0.14" />
    <circle cx="1090" cy="330" r="56" fill="url(#pfAccent)" opacity="0.22" />

    <!-- intro -->
    <rect x="56" y="620" width="1068" height="1.5" fill="#e2dbcd" />
    <g fill="#b6ae9f" font-family="'Inter', Arial, sans-serif">
      <rect x="56" y="648" width="470" height="11" rx="5.5" />
      <rect x="56" y="674" width="410" height="11" rx="5.5" />
      <rect x="56" y="700" width="330" height="11" rx="5.5" />
    </g>
    <rect x="880" y="640" width="244" height="76" rx="18" fill="#141311" />
    <text x="918" y="686" font-size="17" fill="#f2efe9">See my work</text>

    <!-- project strip -->
    <rect x="56" y="780" width="340" height="0" fill="none" />
  </g>

  <g transform="translate(210 830)">
    <rect x="0" y="0" width="340" height="0" fill="none" />
  </g>

  <text x="1180" y="930" font-size="13" letter-spacing="6" fill="#8b857a" font-family="'Inter', Arial, sans-serif">PORTFOLIO · 2026</text>
</svg>
